name: tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
        os: [
          macos-15-intel, 
          macos-14, 
          ubuntu-latest, 
          windows-latest, 
          ubuntu-24.04-arm
        ]
        include:
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.15"
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          persist-credentials: false
      # threejs-materials pins pillow 12.2, which has no cp315 wheels: build it
      - name: pillow build dependencies (Python 3.15)
        if: matrix.python-version == '3.15'
        run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev
      - uses: ./.github/actions/setup/
        with:
          python-version: ${{ matrix.python-version }}
          optional-dependencies: "development"
      - name: test
        run: |
          python -m pytest -n auto --benchmark-disable
